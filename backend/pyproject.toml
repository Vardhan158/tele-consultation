[project]
name = "teleconsult"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "razorpay>=1.4.2",
  "python-socketio[asgi]>=5.11",
  "pymongo>=4.13",
]

[dependency-groups]
dev = [
  "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "aiohttp>=3.10",
  "mypy>=1.10", "ruff>=0.5", "import-linter>=2.0",
  "bandit>=1.7", "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teleconsult"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests", "src"]
markers = ["mongodb_integration: requires the isolated MongoDB test replica set"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]   # asserts are fine in tests

[tool.mypy]
strict = true
plugins = []
mypy_path = "src"
