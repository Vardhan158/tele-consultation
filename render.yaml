services:
  - type: web
    name: teleconsult-backend
    runtime: docker
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TELECONSULT_ENVIRONMENT
        value: production
      - key: MONGODB_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: kaizentrix_care
      - key: NEWSLETTER_WEBSITE_URL
        sync: false
      - key: NEWSLETTER_API_BASE_URL
        sync: false
      - key: NEWSLETTER_POSTER_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Kaizen Care
