services:
  - type: web
    name: teleconsult-backend
    runtime: docker
    autoDeployTrigger: commit
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: TELECONSULT_ENVIRONMENT
        value: production
      - key: MONGODB_ENABLED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: kaizentrix_care
