name: ci
on: [pull_request, push]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
    defaults: { run: { working-directory: backend } }
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - name: Initialize MongoDB replica set
        working-directory: .
        run: |
          MONGO_CONTAINER=$(docker ps -q --filter ancestor=mongo:8.0 | head -n 1)
          docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) }'
          for i in {1..30}; do
            docker exec "$MONGO_CONTAINER" mongosh --quiet --eval 'rs.status().myState' | grep -q '^1$' && break
            sleep 1
          done
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run lint-imports        # module boundaries must hold
      - name: Run backend tests against isolated MongoDB
        env:
          MONGODB_TEST_URI: mongodb://localhost:27017/?replicaSet=rs0
          MONGODB_TEST_DATABASE: teleconsult_ci_${{ github.run_id }}
        run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
